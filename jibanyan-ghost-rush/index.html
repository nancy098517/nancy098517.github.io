<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111225">
<title>吉胖喵・分身大作戰</title>
<style>
:root{color-scheme:dark;--gold:#ffdc83;--ink:#151021;--line:#3d3c60;--muted:#b9b9d4;--panel:#191a32}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 70% 22%,#30224e,transparent 58%),#111225;color:#fff5e3;font-family:system-ui,sans-serif}
main{width:min(100%,880px);display:grid;grid-template-columns:minmax(230px,1fr) minmax(340px,425px);gap:clamp(24px,6vw,76px);align-items:center;padding:24px}
h1{font-weight:950;line-height:1.03;letter-spacing:-.07em;margin:0;font-size:clamp(36px,6.6vw,76px);text-shadow:0 4px #301c47}
h1 span{display:block;color:var(--gold);white-space:nowrap;margin-top:7px}
.intro p{font-size:16px;color:var(--muted);line-height:1.7;margin:21px 0 0}
.guide{margin:26px 0 0;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:10px;color:var(--muted);font-size:14px}
.guide b{color:#fff5e3;margin-right:8px}
.machine{min-width:0;border:1px solid #5a5076;background:var(--panel);border-radius:24px;padding:9px;box-shadow:0 20px 55px #080917a8,inset 0 1px #ffffff18}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:6px 3px 8px;font-size:11px;color:var(--muted);letter-spacing:.08em}
.hud strong{display:block;color:#fff5e3;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.hud strong#hearts{color:#ff8fa4;white-space:nowrap}
.stage{position:relative;overflow:hidden;border-radius:15px;border:1px solid var(--line);background:#252144}
canvas{width:100%;display:block;aspect-ratio:360/495;touch-action:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:22px;background:linear-gradient(180deg,#17152c1a,#131129b8 68%,#1814294a)}
.overlay[hidden]{display:none}
.overlay h2{font-size:clamp(27px,5vw,39px);margin:0;text-shadow:0 3px #241536}
.overlay p{color:#e3d6fa;font-size:14px;margin:8px 0 17px}
button{font:inherit;font-weight:800;border:0;cursor:pointer}
button:focus-visible{outline:3px solid #a7f8ff;outline-offset:3px}
.start{color:var(--ink);background:var(--gold);padding:11px 29px;border-radius:12px;box-shadow:0 4px #b47950}
.start:active{transform:translateY(3px);box-shadow:0 1px #b47950}
.power{margin-top:8px;min-height:46px;width:100%;position:relative;isolation:isolate;overflow:hidden;color:#fff3d2;border:1px solid #595071;border-radius:13px;background:#222039;touch-action:manipulation}
.power::before{position:absolute;z-index:-1;content:"";inset:0 auto 0 0;width:var(--fill,0%);background:#575195;transition:width .15s}
.power.ready{background:var(--gold);color:var(--ink);border-color:var(--gold);box-shadow:0 0 18px #ffd87950}
.power.ready::before{display:none}
.power:disabled{cursor:default}
@media(max-width:670px){main{width:min(100%,445px);grid-template-columns:1fr;gap:8px;padding:8px 10px}.intro{text-align:center}.intro h1{font-size:clamp(21px,6vw,31px);letter-spacing:-.045em}.intro h1 span{display:inline;margin-left:.25em}.intro p,.guide{display:none}canvas{max-height:calc(100svh - 153px);min-height:280px;width:100%;aspect-ratio:360/495}.machine{padding:6px}.hud{padding:3px 0 5px}}
</style>
</head>
<body>
<main>
  <header class="intro">
    <h1>吉胖喵<span>分身大作戰</span></h1>
    <p>妖怪從天而降。守住屋頂 60 秒，抓準時機發功！</p>
    <div class="guide">
      <div><b>左右移動</b>拖曳畫面，或按 ← →</div>
      <div><b>分身發功</b>打倒 6 隻妖怪後，點發功或按空白鍵</div>
      <div><b>屋頂防線</b>放跑 3 隻妖怪，這一局就結束</div>
    </div>
  </header>
  <section class="machine" aria-label="遊戲">
    <div class="hud"><div>分數<strong id="score">0</strong></div><div>秒數<strong id="time">60</strong></div><div>防線<strong id="hearts" aria-label="剩餘 3 點防線">♥ ♥ ♥</strong></div></div>
    <div class="stage">
      <canvas id="field" width="720" height="990" aria-label="遊戲場地，可左右拖曳吉胖喵"></canvas>
      <div id="overlay" class="overlay"><div>
        <h2 id="headline">守住屋頂！</h2>
        <p id="message">左右拖曳或按 ← →，小吉胖喵會自動出擊</p>
        <button class="start" id="start">開始遊戲</button>
      </div></div>
    </div>
    <button class="power" id="power" disabled>發功能量　0 / 6</button>
  </section>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const field = byId('field');
const ctx = field.getContext('2d');
ctx.scale(2, 2);
const W = 360, H = 495, HERO_Y = 447, LIMIT = 60, MAX_CHARGE = 6;
const scoreLabel = byId('score'), timeLabel = byId('time'), heartsLabel = byId('hearts');
const overlay = byId('overlay'), start = byId('start'), power = byId('power');
const clamp = (value, low, high) => Math.max(low, Math.min(high, value));

const sprite = document.createElement('canvas');
const heroImage = new Image();
let spriteReady = false;
heroImage.onload = () => {
  sprite.width = heroImage.width;
  sprite.height = heroImage.height;
  const spriteContext = sprite.getContext('2d');
  spriteContext.drawImage(heroImage, 0, 0);
  const pixels = spriteContext.getImageData(0, 0, sprite.width, sprite.height);
  // Clear only the white background connected to the image's edges.
  const pending = [];
  const add = (x, y) => {
    if (x < 0 || x >= sprite.width || y < 0 || y >= sprite.height) return;
    const index = (y * sprite.width + x) * 4;
    if (!pixels.data[index + 3] || Math.min(...pixels.data.subarray(index, index + 3)) < 226) return;
    pixels.data[index + 3] = 0;
    pending.push([x, y]);
  };
  for (let x = 0; x < sprite.width; x++) {
    add(x, 0);
    add(x, sprite.height - 1);
  }
  for (let y = 0; y < sprite.height; y++) {
    add(0, y);
    add(sprite.width - 1, y);
  }
  while (pending.length) {
    const [x, y] = pending.pop();
    add(x + 1, y); add(x - 1, y); add(x, y + 1); add(x, y - 1);
  }
  spriteContext.putImageData(pixels, 0, 0);
  spriteReady = true;
};

const stars = Array.from({length:55}, (_, i) => ({
  x:(i * 137.41 + 13) % W, y:(i * 83.72 + 19) % 355, size:i % 8 === 0 ? 1.6 : .7
}));
const keys = new Set();
let state = 'intro', heroX, targetX, elapsed, score, hearts, charge;
let enemies, shots, particles, spawnIn, fireIn, burstUp, flash, pointer = null;
let shownTime;
function reset() {
  heroX = targetX = W / 2;
  elapsed = score = charge = burstUp = flash = 0;
  hearts = 3;
  enemies = [];
  shots = [];
  particles = [];
  spawnIn = .35;
  fireIn = 0;
  shownTime = null;
  syncHud();
}
function syncHud() {
  scoreLabel.textContent = score;
  heartsLabel.textContent = Array.from({length:3}, (_, i) => i < hearts ? '♥' : '♡').join(' ');
  heartsLabel.setAttribute('aria-label', '剩餘 ' + hearts + ' 點防線');
  const ready = state === 'play' && charge === MAX_CHARGE;
  power.disabled = !ready;
  power.classList.toggle('ready', ready);
  power.style.setProperty('--fill', charge / MAX_CHARGE * 100 + '%');
  power.textContent = ready ? '分身發功！' : '發功能量　' + charge + ' / ' + MAX_CHARGE;
}
function finish(won) {
  state = 'end';
  keys.clear();
  pointer = null;
  syncHud();
  byId('headline').textContent = won ? '屋頂守住了！' : '妖怪突破防線！';
  byId('message').textContent = '本局得分 ' + score;
  start.textContent = '再玩一局';
  overlay.hidden = false;
  start.focus({preventScroll:true});
}
function firePower() {
  if (state !== 'play' || charge < MAX_CHARGE) return;
  charge = 0;
  flash = .3;
  burstUp = .78;
  for (let row = 0; row < 3; row++) {
    for (let lane = 0; lane < 12; lane++) {
      const destination = 12 + lane * 30.5;
      shots.push({
        x:heroX, y:HERO_Y - 20 - row * 7,
        vy:-615 + row * 82,
        spread:.32, destination, size:row === 0 ? 26 : 19, special:true
      });
    }
  }
  syncHud();
}
function spawnEnemy() {
  const tank = elapsed > 5 && Math.random() < .18 + elapsed / 300;
  const center = (tank ? 40 : 49) + Math.random() * (tank ? 280 : 262);
  enemies.push({
    x:center, center, y:-29, tank, hp:tank ? 4 : 1, radius:tank ? 21 : 14,
    phase:Math.random() * Math.PI * 2, age:0, hit:0,
    speed:(tank ? 40 : 67) + elapsed * .75 + Math.random() * 23
  });
}
function sparkle(x, y, tank, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 38 + Math.random() * 135;
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      life:.2+Math.random()*.32,color:tank ? '#e1a9ff' : '#a0f8f3'});
  }
}
function step(dt) {
  if (state !== 'play') return;
  elapsed = Math.min(LIMIT, elapsed + dt);
  const remaining = Math.ceil(LIMIT - elapsed);
  if (shownTime !== remaining) {
    shownTime = remaining;
    timeLabel.textContent = remaining;
  }

  const direction = Number(keys.has('ArrowRight')) - Number(keys.has('ArrowLeft'));
  targetX = clamp(targetX + direction * 260 * dt, 27, W - 27);
  heroX += (targetX - heroX) * Math.min(1, 19 * dt);
  burstUp = Math.max(0, burstUp - dt);
  flash = Math.max(0, flash - dt);

  fireIn -= dt;
  if (fireIn <= 0) {
    shots.push({x:heroX, y:HERO_Y - 24, vy:-390, size:16, special:false});
    fireIn += .19;
  }
  spawnIn -= dt;
  if (spawnIn <= 0) {
    spawnEnemy();
    spawnIn += .68 + Math.random() * .23 - elapsed * .008;
  }
  for (const enemy of enemies) {
    enemy.age += dt;
    enemy.y += enemy.speed * dt;
    enemy.x = enemy.center + Math.sin(enemy.phase + enemy.age * (enemy.tank ? 1.5 : 3.25)) * (enemy.tank ? 10 : 36);
    enemy.hit = Math.max(0, enemy.hit - dt);
  }
  let changed = false;
  for (const shot of shots) {
    if (shot.special && shot.spread > 0) {
      shot.spread -= dt;
      shot.x += (shot.destination - shot.x) * Math.min(1, dt * 10);
    }
    shot.y += shot.vy * dt;
    for (const enemy of enemies) {
      if (enemy.hp <= 0) continue;
      if (Math.hypot(shot.x - enemy.x, shot.y - enemy.y) > enemy.radius + shot.size * .35) continue;
      enemy.hp -= shot.special ? 4 : 1;
      enemy.hit = .09;
      sparkle(enemy.x, enemy.y, enemy.tank, enemy.hp <= 0 ? 9 : 2);
      if (enemy.hp <= 0) {
        score += enemy.tank ? 30 : 10;
        charge = Math.min(MAX_CHARGE, charge + 1);
        changed = true;
      }
      if (!shot.special) {
        shot.used = true;
        break;
      }
    }
  }
  shots = shots.filter(shot => shot.y > -30 && !shot.used);
  enemies = enemies.filter(enemy => {
    if (enemy.hp <= 0) return false;
    if (enemy.y < 465) return true;
    hearts = Math.max(0, hearts - 1);
    changed = true;
    return false;
  });
  for (const part of particles) {
    part.x += part.vx * dt;
    part.y += part.vy * dt;
    part.life -= dt;
  }
  particles = particles.filter(part => part.life > 0);
  if (changed) syncHud();
  if (!hearts || elapsed >= LIMIT) finish(hearts > 0);
}
function dot(x, y, radius, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x,y,radius,0,Math.PI * 2);
  ctx.fill();
}
const sky = ctx.createLinearGradient(0,0,0,H);
sky.addColorStop(0,'#1b1935'); sky.addColorStop(.67,'#4a3262'); sky.addColorStop(1,'#7d4c75');
const moonlight = ctx.createRadialGradient(274,87,12,274,87,64);
moonlight.addColorStop(0,'#ffe1a759'); moonlight.addColorStop(1,'#ffe1a700');
function drawTown() {
  ctx.fillStyle = '#25203d';
  for (let i = 0; i < 15; i++) {
    const x = i * 27 - 9, height = 27 + (i * 43) % 57;
    ctx.fillRect(x,H-height,24,height);
    for (let row = 0; row < (height - 15) / 11; row++) {
      ctx.fillStyle = (i + row) % 3 ? '#47324f' : '#d78e79';
      ctx.fillRect(x + 6,H-height+9+row*11,3,5);
      ctx.fillRect(x + 14,H-height+9+row*11,3,5);
      ctx.fillStyle = '#25203d';
    }
  }
  ctx.fillStyle = '#201c35';
  ctx.fillRect(0,471,W,24);
  ctx.fillStyle = '#e98eac';
  ctx.fillRect(0,471,W,1);
  ctx.fillStyle = '#3e304e';
  for (let i = 0; i < 18; i++) ctx.fillRect(i*22,479,19,1);
}
function drawGhost(enemy) {
  const {x,y,radius:r,tank} = enemy;
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle = enemy.hit ? '#fff5eb' : tank ? '#ad80dc' : '#74c9c4';
  ctx.strokeStyle = tank ? '#432455' : '#25495b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-r,r*.38);
  ctx.bezierCurveTo(-r*1.2,-r*1.4,r*1.2,-r*1.4,r,r*.38);
  ctx.quadraticCurveTo(r*.82,r*1.13,r*.53,r*.77);
  ctx.quadraticCurveTo(r*.14,r*.46,0,r*.88);
  ctx.quadraticCurveTo(-r*.19,r*1.12,-r*.45,r*.72);
  ctx.quadraticCurveTo(-r*.58,r*.65,-r*.8,r*.89);
  ctx.quadraticCurveTo(-r*1.02,r*.93,-r,r*.38);
  ctx.fill();
  ctx.stroke();
  if (tank) {
    dot(-r*.64,-r*.66,6,'#dfb6ff');
    dot(r*.64,-r*.66,6,'#dfb6ff');
  }
  dot(-r*.31,-2,2.1,'#201934');
  dot(r*.31,-2,2.1,'#201934');
  dot(0,5,tank ? 3.6 : 2.4,'#352041');
  if (tank && enemy.hp < 4) {
    ctx.fillStyle = '#281d38';
    ctx.fillRect(-14,-r-6,28,3);
    ctx.fillStyle = '#f1beff';
    ctx.fillRect(-14,-r-6,7*enemy.hp,3);
  }

}
function drawCat(x, y, size) {

  drawTown();

  if (state === 'intro') {
    drawGhost({x:67,y:132,radius:20,tank:false});
    drawGhost({x:293,y:166,radius:26,tank:true});
  }
  for (const enemy of enemies) drawGhost(enemy);
  for (const shot of shots) {
    ctx.fillStyle = shot.special ? '#83fef6' : '#77c9f2';
    ctx.globalAlpha = .63;
    ctx.fillRect(shot.x - 1.5,shot.y + 4,3,shot.special ? 17 : 9);
    ctx.globalAlpha = 1;
    drawCat(shot.x,shot.y,shot.size);
  }
  for (const part of particles) {
    ctx.globalAlpha = clamp(part.life * 3,0,1);
    dot(part.x,part.y,2.3,part.color);
  }
  ctx.globalAlpha = 1;
  const intro = state === 'intro';
  const y = intro ? 340 + Math.sin(clock*3)*4 : HERO_Y;
  ctx.save();
  if (charge === MAX_CHARGE || burstUp > 0 || intro) {
    ctx.shadowBlur = intro ? 19 : 13;
    ctx.shadowColor = '#8bf5f9';
  }
  drawCat(heroX,y,intro ? 106 : 60 + burstUp * 15);
  ctx.restore();
  if (flash > 0) {
    ctx.fillStyle = 'rgba(150,255,246,' + flash*.39 + ')';
    ctx.fillRect(0,0,W,H);
  }
}
function aim(event) {
  const rect = field.getBoundingClientRect();
  targetX = clamp((event.clientX - rect.left) * W / rect.width,27,W-27);
}
field.addEventListener('pointerdown', event => {
  if (state !== 'play' || pointer !== null) return;
  pointer = event.pointerId;
  field.setPointerCapture(pointer);
  aim(event);
});
field.addEventListener('pointermove', event => {
  if (pointer === event.pointerId && state === 'play') aim(event);
});
field.addEventListener('lostpointercapture', event => {
  if (pointer === event.pointerId) pointer = null;
});
window.addEventListener('keydown', event => {
  if (state !== 'play') return;
  if (event.code === 'Space') {
    event.preventDefault();
    if (!event.repeat) firePower();
  }
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    keys.add(event.key);
  }
});
window.addEventListener('keyup', event => keys.delete(event.key));
window.addEventListener('blur', () => keys.clear());
start.addEventListener('click', () => {
  state = 'play';
  reset();
  timeLabel.textContent = LIMIT;
  overlay.hidden = true;
});
power.addEventListener('click', firePower);
reset();
let last;
function frame(now) {
  const dt = last == null ? 0 : Math.min(.045,(now-last)/1000);
  last = now;
  step(dt);
  draw(now/1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
