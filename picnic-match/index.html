<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174c41"><title>Nancy 的野餐籃｜記憶配對</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9f4ed;color:#183f36;font-family:system-ui,"Noto Sans TC",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #d76a39;outline-offset:4px}header{max-width:1180px;margin:auto;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-family:Georgia,serif;font-size:25px;font-weight:bold}.tiny{font-size:14px;color:#526d61}.sound{border:1px solid #aec8b7;background:#fff9;border-radius:30px;padding:10px 16px;color:#245344}main{max-width:1180px;margin:auto;padding:8px 28px 36px}.intro{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:24px}.eyebrow{color:#ad5939;font-size:14px;letter-spacing:.13em;font-weight:750}h1{font-size:clamp(30px,4.5vw,48px);letter-spacing:-.04em;margin:8px 0}p{line-height:1.7;margin:8px 0}.sun{width:76px;height:76px;border-radius:50%;background:#f5bd51;box-shadow:0 0 0 12px #f7ca6733;display:grid;place-items:center;font-size:37px;margin:10px 22px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px}.play{background:#fff;border-radius:26px;padding:24px;box-shadow:0 10px 45px #25442c08}.modes{display:flex;gap:7px;background:#eef3ed;border-radius:14px;padding:5px;flex-wrap:wrap}.modes button{flex:1;border:0;border-radius:10px;padding:12px 9px;color:#466154;background:transparent;white-space:nowrap;font-weight:650}.modes button[aria-pressed=true]{background:#215947;color:white;box-shadow:0 3px 6px #1d4b3922}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 12px}.tools{display:flex;gap:9px;align-items:center}select,.reset{border:1px solid #ced9ce;border-radius:10px;background:white;padding:9px;color:#244f40;font-size:14px}.score{font-size:15px;color:#53685a}.score b{color:#254d3b}.status{min-height:35px;font-size:15px;color:#5f6f60;margin:8px 0}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{border:0;border-radius:16px;background:#f1f5ee;position:relative;aspect-ratio:1/.96;perspective:700px;padding:0;transition:transform .18s;min-width:0}.card:hover:not(:disabled){transform:translateY(-3px)}.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .38s;border-radius:16px}.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}.front,.back{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}.back{background:#d9e9dc;background-image:radial-gradient(#fff9 1px,transparent 1px);background-size:12px 12px;border:2px solid #cee0d0}.back span{background:#f8fbf4;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;font-size:26px}.front{transform:rotateY(180deg);background:#fff9ec;border:2px solid #e9d6aa;gap:5px}.glyph{font-size:clamp(32px,4vw,54px);line-height:1.2}.label{font-size:15px;font-weight:650}.word{font-size:clamp(18px,2.6vw,29px);font-weight:750;overflow-wrap:anywhere;padding:5px}.card.matched .front{background:#edf7e6;border-color:#bfd0ac}.card.matched::after{content:'✓';position:absolute;right:8px;top:5px;color:#548356;font-size:17px}.card:disabled{cursor:default;color:inherit;opacity:1}.aside{display:flex;flex-direction:column;gap:18px}.basket{background:#f7e9ce;border-radius:26px;padding:24px;min-height:250px;position:relative;overflow:hidden}.basket h2{margin:0;font-size:21px}.basket-art{font-size:64px;text-align:center;margin:10px 0}.collected{display:flex;flex-wrap:wrap;gap:9px;min-height:42px;justify-content:center}.prize{font-size:29px;animation:pop .5s}.empty{text-align:center;color:#826c4d;font-size:14px}.progress{height:7px;border-radius:10px;background:#e4d8bd;margin-top:20px}.fill{height:100%;background:#bd7143;border-radius:10px;transition:width .5s;width:0}.instructions{background:#dbeadf;border-radius:22px;padding:22px}.instructions h2{font-size:17px;margin:0 0 12px}.instructions ol{padding-left:20px;margin:0;font-size:15px;line-height:2}.listen{margin-top:12px;border:0;border-radius:9px;background:white;padding:10px 14px;color:#245040;width:100%}footer{font-size:13px;text-align:center;color:#657a6c;padding:18px}.completion{position:fixed;inset:0;background:#123c31b8;display:grid;place-items:center;padding:24px;z-index:20}.completion[hidden]{display:none}.celebrate{background:#fffaf0;border-radius:28px;padding:36px;max-width:450px;text-align:center;box-shadow:0 30px 90px #0003}.celebrate .picture{font-size:66px}.celebrate h2{font-size:27px;margin:14px 0}.primary{background:#235a45;color:white;border:0;border-radius:12px;padding:13px 22px;font-weight:650;margin-top:16px}.secondary{border:0;background:transparent;padding:12px;color:#4b6555}.hint-note{font-size:13px;color:#667864}.celebrate p{font-size:16px}@keyframes pop{from{transform:translateY(-20px) scale(.5);opacity:0}to{transform:none;opacity:1}}@media(min-width:950px){.board.twenty{grid-template-columns:repeat(5,minmax(0,1fr))}.twenty .glyph{font-size:41px}.twenty .word{font-size:21px}}@media(max-width:760px){header{padding:18px 18px 12px}main{padding:8px 14px 25px}.intro{margin:0 4px 18px}.sun{display:none}.layout{grid-template-columns:1fr;gap:14px}.play{padding:16px;border-radius:20px}.board{gap:9px}.card{border-radius:12px;aspect-ratio:1/.98}.front,.back,.inner{border-radius:12px}.glyph{font-size:35px}.label{font-size:12px}.word{font-size:18px}.back span{width:36px;height:36px;font-size:22px}.modes button{font-size:14px;padding:11px 6px}.aside{display:grid;grid-template-columns:1fr 1fr;gap:12px}.basket{padding:18px;min-height:0;border-radius:20px}.basket-art{font-size:42px;margin:4px 0}.basket h2{font-size:18px}.instructions{padding:18px;border-radius:20px}.instructions ol{font-size:14px;line-height:1.8}.intro p{font-size:15px}.score{font-size:14px}.prize{font-size:22px}.progress{margin-top:12px}}@media(max-width:370px){.aside{grid-template-columns:1fr}.word{font-size:16px}.toolbar{gap:8px}.tools{gap:5px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><div class="brand">Nancy<span style="color:#ad6b47">.</span> <span class="tiny">小小遊戲室</span></div><button id="sound" class="sound" aria-pressed="false">開啟聲音</button></header><main><div class="intro"><div><div class="eyebrow">A LITTLE MEMORY, A LOVELY PICNIC</div><h1>Nancy 的野餐籃</h1><p>翻一張、記一下，把野餐的美好一對對收好。</p></div><div class="sun" aria-hidden="true">☀</div></div><div class="layout"><section class="play" aria-label="翻牌遊戲"><div class="modes" aria-label="遊戲模式"><button data-mode="picture" aria-pressed="true">🍎 圖案配對</button><button data-mode="letters" aria-pressed="false">Aa 字母配對</button><button data-mode="words" aria-pressed="false">Apple 圖片與英文</button></div><div class="toolbar"><div class="tools"><label for="size" class="tiny">牌數</label><select id="size"><option value="8">8 張・入門</option><option value="12" selected>12 張・標準</option><option value="20">20 張・挑戰</option></select><button id="reset" class="reset">重新開始</button></div><div class="score">配對 <b id="pairs">0 / 6</b>　翻牌 <b id="moves">0</b> 次</div></div><p class="status" id="status" role="status" aria-live="polite">找到兩張相同的圖案，送進野餐籃。</p><div id="board" class="board"></div></section><aside class="aside"><section class="basket"><h2 id="basketTitle">今天的野餐籃</h2><div class="basket-art" aria-hidden="true">🧺</div><div class="collected" id="collected"><span class="empty">等你收集第一份驚喜</span></div><div class="progress" aria-label="配對進度"><div id="fill" class="fill"></div></div><p class="empty" id="basketNote">慢慢找，不用趕。</p></section><section class="instructions"><h2>小小玩法</h2><ol><li>一次翻開兩張牌。</li><li id="rule">相同圖案就是好朋友。</li><li>配對成功，收進籃子！</li></ol><button class="listen" id="listen" disabled>聽聽剛才那張</button><p class="hint-note" id="audioNote">開啟聲音，可聽英文與配對音效。</p></section></aside></div></main><footer>不倒數、不扣分。每次配對，都是一點點進步。<br>進度僅存在這台裝置的瀏覽器。</footer><div id="completion" class="completion" hidden><div class="celebrate" role="dialog" aria-modal="true" aria-labelledby="winTitle"><div class="picture" aria-hidden="true">🧺🌼🍎</div><h2 id="winTitle">野餐準備好了！</h2><p id="winText"></p><button id="again" class="primary">再玩一籃</button><br><button id="closeWin" class="secondary">看看我的成果</button></div></div><script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),KEY='nancy-picnic-match-v1',food=[['🍎','蘋果','Apple'],['🍌','香蕉','Banana'],['🍓','草莓','Strawberry'],['🍊','橘子','Orange'],['🍇','葡萄','Grapes'],['🥝','奇異果','Kiwi'],['🍉','西瓜','Watermelon'],['🍒','櫻桃','Cherry'],['🥪','三明治','Sandwich'],['🥛','牛奶','Milk']];
let state,first=null,locked=false,generation=0,last=null,timer=null,sound=false,ctx=null,lastFocus=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{$('basketNote').textContent='此瀏覽器無法存檔，仍可繼續玩。'}}
function speak(card){if(!sound)return;if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(card.say);u.lang='en-US';u.rate=.85;const voice=speechSynthesis.getVoices().find(v=>/^en[-_]US/i.test(v.lang));if(voice)u.voice=voice;speechSynthesis.cancel();speechSynthesis.speak(u)}}
function tone(){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume().then(()=>{for(let i=0;i<2;i++){const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.1;o.frequency.value=i?880:660;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.2);o.onended=()=>{o.disconnect();g.disconnect()}}}).catch(()=>{})}catch{}}
function makeDeck(mode,size){let pool;if(mode==='letters'){pool=shuffle(Array.from({length:26},(_,i)=>{const c=String.fromCharCode(65+i);return{id:c,a:c,b:c.toLowerCase(),say:c,icon:c}})).slice(0,size/2)}else{pool=shuffle(food.map((f,i)=>({id:String(i),a:f[0],b:mode==='words'?f[2]:f[0],say:f[2],icon:f[0],zh:f[1]}))).slice(0,size/2)}return shuffle(pool.flatMap(p=>[0,1].map(side=>({...p,side,uid:p.id+'-'+side,matched:false}))))}
function newGame(mode=state?.mode||'picture',size=Number($('size').value)){generation++;clearTimeout(timer);first=null;locked=false;last=null;if('speechSynthesis'in window)speechSynthesis.cancel();$('completion').hidden=true;state={version:1,mode,size,moves:0,cards:makeDeck(mode,size)};render();save()}
function render(){const {mode,cards,size}=state;$('size').value=size;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('rule').textContent=mode==='letters'?'找到大寫與小寫，例如 A 和 a。':mode==='words'?'找到圖片和英文，例如 🍎 和 Apple。':'相同圖案就是好朋友。';$('status').textContent=mode==='letters'?'大寫找小寫，每局隨機選字母。':mode==='words'?'看圖片，找出它的英文好朋友。':'找到兩張相同的圖案，送進野餐籃。';$('basketTitle').textContent=mode==='letters'?'我的字母收藏':'今天的野餐籃';$('board').className='board'+(size===20?' twenty':'');$('board').replaceChildren(...cards.map((c,i)=>{const b=document.createElement('button');b.className='card'+(c.matched?' matched':'');b.type='button';b.dataset.index=i;b.setAttribute('aria-label','第 '+(i+1)+' 張，未翻開');b.innerHTML='<span class="inner"><span class="back" aria-hidden="true"><span>🌿</span></span><span class="front" aria-hidden="true"><span class="'+(mode==='words'&&c.side===1?'word':'glyph')+'"></span><span class="label"></span></span></span>';b.querySelector('.front > span').textContent=c.side===0?c.a:c.b;b.querySelector('.label').textContent=mode==='picture'?c.zh:mode==='letters'?(c.side===0?'大寫':'小寫'):'';b.onclick=()=>flip(i);return b}));update();$('listen').disabled=!last}
function update(){const done=state.cards.filter(c=>c.matched),n=done.length/2;$('pairs').textContent=n+' / '+state.size/2;$('moves').textContent=state.moves;$('fill').style.width=(n/(state.size/2)*100)+'%';const collected=done.filter(c=>c.side===0);$('collected').replaceChildren(...collected.map(c=>{const s=document.createElement('span');s.className='prize';s.textContent=c.icon;s.title=c.say;s.setAttribute('aria-label',c.say);return s}));if(!n)$('collected').innerHTML='<span class="empty">等你收集第一份驚喜</span>';state.cards.forEach((c,i)=>{const b=$('board').children[i];b.classList.toggle('matched',c.matched);b.disabled=c.matched;if(c.matched)b.setAttribute('aria-label',c.say+'，已配對')});$('basketNote').textContent=n===state.size/2?'收集完成，真棒！':'已收集 '+n+' 份小美好。'}
function flip(i){const c=state.cards[i];if(locked||c.matched||first===i)return;const b=$('board').children[i];b.classList.add('open');b.setAttribute('aria-label',(c.side===0?c.a:c.b)+'，已翻開');last=c;$('listen').disabled=false;speak(c);if(first===null){first=i;return}state.moves++;const j=first;first=null;locked=true;const g=generation;if(state.cards[j].id===c.id){c.matched=true;state.cards[j].matched=true;tone();update();save();$('status').textContent='找到 '+(state.mode==='letters'?c.id+' 和 '+c.id.toLowerCase():c.zh+' '+c.say)+'！收進籃子了。';timer=setTimeout(()=>{if(g!==generation)return;locked=false;if(state.cards.every(x=>x.matched))win()},500)}else{$('moves').textContent=state.moves;save();$('status').textContent='記住它們的位置，再試一次。';timer=setTimeout(()=>{if(g!==generation)return;[i,j].forEach(k=>{const el=$('board').children[k];el.classList.remove('open');el.setAttribute('aria-label','第 '+(k+1)+' 張，未翻開')});locked=false;$('status').textContent='再找找看，下一對好朋友在哪裡？'},1150)}}
function win(){lastFocus=document.activeElement;$('winTitle').textContent=state.mode==='letters'?'字母朋友都到齊了！':'野餐準備好了！';$('winText').textContent='你用 '+state.moves+' 次翻牌，找到了 '+state.size/2+' 對好朋友。帶著你的收藏，出發野餐吧！';$('completion').hidden=false;$('again').focus()}
$('completion').addEventListener('keydown',e=>{if(e.key==='Escape'){$('closeWin').click();return}if(e.key==='Tab'){const a=$('again'),b=$('closeWin');if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});
$('closeWin').onclick=()=>{$('completion').hidden=true;(lastFocus?.disabled?$('reset'):lastFocus||$('reset')).focus()};$('again').onclick=()=>{newGame();$('board').children[0].focus()};
$('reset').onclick=()=>newGame();$('size').onchange=()=>newGame();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(state.mode!==b.dataset.mode)newGame(b.dataset.mode)});
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'聲音：開':'開啟聲音';$('sound').setAttribute('aria-pressed',String(sound));$('audioNote').textContent=sound?('speechSynthesis'in window?'英文使用裝置內建語音，發音依瀏覽器而異。':'此瀏覽器不支援朗讀，仍可玩配對。'):'開啟聲音，可聽英文與配對音效。';if(sound){if(last)speak(last);else tone()}else if('speechSynthesis'in window)speechSynthesis.cancel()};$('listen').onclick=()=>{if(last){if(!sound)$('sound').click();else speak(last)}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version===1&&['picture','letters','words'].includes(s.mode)&&[8,12,20].includes(s.size)&&Number.isInteger(s.moves)&&s.moves>=0&&Array.isArray(s.cards)&&s.cards.length===s.size){const ids=new Set(s.cards.map(c=>c.id));if(ids.size!==s.size/2)throw Error();for(const id of ids){const pair=s.cards.filter(c=>c.id===id);if(pair.length!==2||new Set(pair.map(c=>c.side)).size!==2||pair[0].matched!==pair[1].matched)throw Error();for(const c of pair){if(typeof c.matched!=='boolean'||![0,1].includes(c.side))throw Error();if(s.mode==='letters'){if(!/^[A-Z]$/.test(c.id))throw Error();c.a=c.id;c.b=c.id.toLowerCase();c.say=c.id;c.icon=c.id}else{const f=food[Number(c.id)];if(!f||String(Number(c.id))!==c.id)throw Error();Object.assign(c,{a:f[0],b:s.mode==='words'?f[2]:f[0],say:f[2],icon:f[0],zh:f[1]})}}}state=s;render()}else newGame()}catch{newGame()}
})();
</script></body></html>
