<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行中，留一個下午給自己｜Nancy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#12302d;--muted:#4d6b67;--paper:#f3f8f6;--card:#fff;--teal:#0f6b63;--teal-deep:#0a3f3b;--mint:#cfe9e2;--amber:#e3a23a;--line:#d3e3de;
--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.8;font-size:17px}
a{color:var(--teal)}
a:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:4px}
header{background:rgba(243,248,246,.94);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:760px;margin:0 auto;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{font-family:var(--serif);font-weight:900;font-size:22px;color:var(--teal-deep);text-decoration:none;letter-spacing:.04em}
.back{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--mint);color:var(--teal-deep);font-weight:700;text-decoration:none;font-size:15px}
.back:hover{background:var(--teal-deep);color:#fff}
main{max-width:760px;margin:0 auto;padding:40px 24px 24px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,5vw,38px);line-height:1.35;color:var(--teal-deep);margin:0 0 8px}
.sub{margin:0 0 28px;color:var(--muted)}
h2{font-family:var(--serif);font-weight:900;font-size:24px;color:var(--teal-deep);margin:40px 0 16px}
article p{margin:0 0 16px;line-height:1.95}
.motto{margin-top:28px;font-family:var(--serif);font-weight:600;color:var(--teal-deep);font-size:18px}
.fig{margin:0 0 24px}
.fig img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;cursor:zoom-in}
.fig figcaption{margin-top:8px;font-size:14px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--mint)}
.tl li{display:flex;gap:16px;padding:10px 0 10px 18px;position:relative}
.tl li::before{content:"";position:absolute;left:-9px;top:20px;width:15px;height:15px;border-radius:50%;background:var(--card);border:3px solid var(--teal)}
.yr{flex:0 0 3.4em;font-weight:700;color:var(--teal)}
.tl .d{color:var(--muted);font-size:15px}
.end{margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
footer{max-width:760px;margin:0 auto;padding:24px 24px 48px;color:var(--muted);font-size:14px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,30,28,.92);overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.lb.on{display:block}
.lb img{display:block;width:max(100%,900px);height:auto;cursor:zoom-out}
.lb .x{position:fixed;top:12px;right:12px;z-index:51;background:#fff;color:var(--teal-deep);border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;cursor:pointer}
.afternoon-photo{max-width:480px;margin:24px auto}
.afternoon-photo img{cursor:auto}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="index.html">Nancy</a><a class="back" href="index.html#travel">← 回到網頁</a></div></header>
<main>
  <article>
    <h1>旅行中，留一個下午給自己</h1>
    <figure class="fig afternoon-photo">
      <img src="travel-afternoon-bookshelf.webp" alt="玻璃屋頂下，高聳的弧形木書牆亮著暖色燈光" width="1080" height="1440">
    </figure>
    <p>旅行讓我有機會走進別人的日常，看看不同地方的人怎麼生活。</p>
    <p>有時候，只是在一整面書牆前停一會兒，或找間咖啡館坐下，慢慢喝完一杯咖啡。</p>
    <p>那個下午好像什麼都沒做。回來以後，卻還記得抬頭看見的光，和那時難得悠閒的心情。</p>
  </article>
</main>
<footer>© Nancy</footer>
</body>
</html>
