<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸福列車・家庭冒險日</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#244848;background:#f2f7f2}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#146b72,#6aaf88);color:white;padding:32px max(18px,calc((100% - 950px)/2))}h1{margin:5px 0;font-size:clamp(27px,5vw,43px)}main{max-width:980px;margin:auto;padding:18px}.panel{background:white;border:1px solid #e0ece1;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 5px 17px #244a4012}h2{margin:0 0 12px}p{line-height:1.7}button,input,textarea{font:inherit}button{background:#147b70;color:white;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:700}button.alt{background:#e7f2eb;color:#244848}button:disabled{opacity:.55}input[type=text],textarea{border:1px solid #bcd3c6;border-radius:10px;padding:10px;width:100%;max-width:370px}textarea{max-width:none;min-height:85px}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid,.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{background:white;border:2px solid #d6e8dc;border-radius:16px;padding:15px 8px;color:#244848;min-height:130px}.tile.on{background:#e4f8e9;border-color:#188c79}.tile span{display:block;font-size:37px}.stamp{background:#f3f6f2;border:2px dashed #b6cec0;border-radius:15px;text-align:center;padding:12px 4px}.stamp.yes{background:#fff2d0;border:2px solid #dfa13e}.stamp span{font-size:30px;display:block}.board{background:linear-gradient(130deg,#eff8ed,#e9f0ff);border-radius:17px;padding:18px;margin:16px 0}.status{border-left:4px solid #258974;border-radius:9px;background:#e6f6eb;padding:12px;min-height:50px}.track{height:150px;position:relative;background:linear-gradient(#a3d5b3,#82bba0);border:5px solid #d4eed8;border-radius:14px;overflow:hidden}.track:before,.track:after{content:"";background:#fff8;position:absolute;top:0;height:100%;width:15px;transform:rotate(15deg)}.track:before{left:35%}.track:after{left:65%}.cart{position:absolute;top:7px;left:45%;font-size:43px;transition:top 1.5s,left 1.5s,transform 1.5s}.cart.go{top:94px;transform:rotate(16deg)}.cart.flip{transform:rotate(375deg)}.target{width:168px;height:168px;border-radius:50%;margin:15px auto;position:relative;background:radial-gradient(circle,#ffdf61 0 13%,#e85858 14% 29%,white 30% 45%,#478bd4 46% 64%,white 65%);border:3px solid #63859c}.arrow{position:absolute;transform:translate(-50%,-50%);font-size:28px}.putt{background:#b9dcae;height:125px;max-width:520px;border-radius:15px;position:relative;margin:13px auto}.hole{position:absolute;right:35px;top:54px;width:28px;height:15px;border-radius:50%;background:#304a3e}.ball{position:absolute;left:15px;top:43px;font-size:26px;transition:left 1.4s}.pins{background:#e0eefa;border-radius:15px;display:flex;justify-content:space-around;align-items:end;padding:16px;height:115px}.pin{font-size:30px}input[type=range]{accent-color:#187c71;width:min(95%,350px)}.muted,small{color:#617b74;font-size:13px}.hidden{display:none}@media(max-width:650px){.grid,.stamps{grid-template-columns:repeat(2,1fr)}.panel{padding:15px}}@media print{header,.grid,button,#play,#message,#backup,.muted{display:none!important}}
</style></head><body><header><div>🚄 獨立原創・互動家庭日</div><h1>幸福列車・家庭冒險日</h1><p>搭上冒險列車，前往農場！滑草、射箭、高爾夫、彈珠台，玩過關才能蓋章。</p></header><main>
<section class="panel"><h2>🎟️ 家庭冒險護照</h2><div class="flex"><input id="team" type="text" maxlength="35" placeholder="隊伍暱稱（請勿填個資）"><button id="saveTeam">保存隊名</button></div><p class="muted">所有成績存在本機瀏覽器；不同裝置需匯出／匯入備份。</p><div class="stamps" id="stamps"></div><p id="progress"></p></section>
<section class="panel"><h2>🎮 選擇遊戲場</h2><p>四關都可以點進去真正遊玩；未達成過關條件就不會蓋章，歡迎重試！</p><div class="grid" id="games"></div><div class="board" id="play"><p>請選擇一個遊戲場。</p></div><div class="status" id="message" role="status" aria-live="polite">冒險準備開始！</div></section>
<section class="panel"><h2>💌 幸福列車紀念卡</h2><p>寫下今天最難忘的時刻，製作自己的列車祝福卡。</p><textarea id="memory" maxlength="500" placeholder="今天最棒的回憶……"></textarea><div class="flex"><button id="saveMemory">保存回憶</button><button id="print" class="alt">列印紀念卡</button></div><div id="cardPreview" class="status"></div></section>
<section class="panel" id="backup"><h2>💾 本機備份</h2><p>自動保存隊伍、印章、分數和卡片內容；清除瀏覽器資料會遺失，請先下載備份。</p><div class="flex"><button id="export">下載 JSON 備份</button><button id="importBtn" class="alt">匯入備份</button><input id="file" class="hidden" type="file" accept="application/json,.json"><button id="reset" class="alt">清除進度</button></div></section>

</main><script>
const KEY='family-adventure-2026-v1',names=['滑草場','射箭場','高爾夫場','彈珠台'],emoji=['🛷','🏹','⛳','🎰'];const blank=()=>({team:'',stamps:[false,false,false,false],scores:[null,null,null,null],memory:''});let state=blank();try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.stamps)){state={team:String(s.team||'').slice(0,35),stamps:Array.from({length:4},(_,i)=>s.stamps[i]===true),scores:Array.from({length:4},(_,i)=>typeof s.scores?.[i]==='number'?s.scores[i]:null),memory:String(s.memory||'').slice(0,500)}}}catch(e){}let selected=-1,car=0,busy=false;const el=id=>document.getElementById(id),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function render(){el('stamps').innerHTML=names.map((n,i)=>'<div class="stamp '+(state.stamps[i]?'yes':'')+'"><span>'+emoji[i]+'</span><strong>'+n+'</strong><br><small>'+(state.stamps[i]?'✅ 已蓋章':'🔒 待挑戰')+'</small></div>').join('');const c=state.stamps.filter(Boolean).length;el('progress').textContent='闖關進度：'+c+'/4 枚'+(c===4?' 🎉 全關卡完成！':'');el('cardPreview').textContent='🚄 '+(state.team||'幸福冒險隊')+'｜'+c+'/4 闖關章｜'+(state.memory||'尚未寫下回憶')}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('儲存失敗，請確認瀏覽器儲存權限。')}render()}function message(t){el('message').textContent=t}function pass(i,score,detail){state.stamps[i]=true;state.scores[i]=score;save();message('🎉 '+names[i]+' 過關！已獲得闖關章。'+detail)}function enter(i){if(busy)return;selected=i;document.querySelectorAll('.tile').forEach((x,j)=>x.classList.toggle('on',i===j));draw();message('已進入 '+names[i]+'。完成遊戲才能取得印章。')}
function draw(){const b=el('play');if(selected===0){b.innerHTML='<h3>🛷 滑草場｜選車出發</h3><p>選擇滑草車，按下滑行，觀看隨機路線與結局。</p><div class="flex"><button class="alt" data-car="0">綠色車</button><button class="alt" data-car="1">藍色車</button><button class="alt" data-car="2">黃色車</button><button id="go">開始滑行</button></div><div class="track"><div class="cart" id="cart">🛷</div></div><small>安全抵達終點或完成花式滑行即過關。卡通碰撞事件不會造成傷害。</small>';b.querySelectorAll('[data-car]').forEach(x=>x.onclick=()=>{car=Number(x.dataset.car);message('已選 '+['綠色','藍色','黃色'][car]+'滑草車！')});el('go').onclick=()=>{if(busy)return;busy=true;el('go').disabled=true;let result=R(0,4);const c=el('cart');c.classList.add('go');c.style.left=(20+R(0,55))+'%';if(result===1)c.classList.add('flip');message('正在滑下草坡……');setTimeout(()=>{busy=false;c.classList.remove('go','flip');c.style.left='45%';el('go').disabled=false;const results=['漂亮地滑抵終點！','成功完成旋轉花式！','與另一台車擦肩而過，安全停下，再挑戰一次！','順利繞過彎道衝線！','滑到半途停住，請重新挑戰！'];if([0,1,3].includes(result))pass(0,100,results[result]);else message('🛷 '+results[result])},1700)}}
else if(selected===1){b.innerHTML='<h3>🏹 射箭場｜瞄準靶心</h3><p>移動瞄準方向，射出帶有隨機偏差的箭。命中中心區就過關。</p><label>方向 <input id="aim" type="range" min="-60" max="60" value="0"> <output id="aimVal">0</output></label><div class="target" id="target"></div><button id="shoot">放箭！</button><p class="muted">過關條件：落點距靶心 35 單位以內。</p>';el('aim').oninput=()=>el('aimVal').textContent=el('aim').value;el('shoot').onclick=()=>{let x=Number(el('aim').value)+R(-30,30),y=R(-50,50),dist=Math.round(Math.hypot(x,y));el('target').innerHTML='<span class="arrow" style="left:'+Math.max(5,Math.min(95,50+x/2))+'%;top:'+Math.max(5,Math.min(95,50+y/2))+'%">➶</span>';if(dist<=35)pass(1,Math.max(10,100-dist),'射中內圈！');else message('箭落在外圈（偏差 '+dist+'），調整方向再試一次。')}}
else if(selected===2){b.innerHTML='<h3>⛳ 高爾夫場｜推桿挑戰</h3><p>調整擊球力道，讓球靠近洞口。風向會造成些微隨機變化。</p><label>力道 <input id="power" type="range" min="10" max="100" value="55"> <output id="powerVal">55</output>%</label><div class="putt"><span class="ball" id="ball">⚪</span><span class="hole"></span></div><button id="hit">推桿！</button><p class="muted">過關條件：落在洞口附近的容許區內。</p>';el('power').oninput=()=>el('powerVal').textContent=el('power').value;el('hit').onclick=()=>{if(busy)return;busy=true;el('hit').disabled=true;const p=Number(el('power').value),actual=p+R(-9,9);el('ball').style.left=Math.max(15,Math.min(440,actual*4.45))+'px';message('小白球滾動中……');setTimeout(()=>{busy=false;el('hit').disabled=false;if(Math.abs(actual-87)<=9)pass(2,100-Math.abs(actual-87),'成功推桿進洞！');else message('球在洞口'+(actual<87?'前方停住':'後方滾過')+'，再調整力道試試！')},1500)}}
else if(selected===3){b.innerHTML='<h3>🎰 彈珠台｜懷舊挑戰</h3><p>選擇發射力道，鋼珠會隨機落入不同得分槽。累積單次 60 分以上即可過關。</p><label>發射力道 <input id="launch" type="range" min="1" max="10" value="5"> <output id="launchVal">5</output></label><div class="pins" id="pins"><span class="pin">🔵</span><span class="pin">🟡</span><span class="pin">🔴</span><span class="pin">🟢</span><span class="pin">⭐</span></div><button id="fire">發射彈珠！</button><p class="muted">過關條件：單次獲得 60 分以上。</p>';el('launch').oninput=()=>el('launchVal').textContent=el('launch').value;el('fire').onclick=()=>{if(busy)return;busy=true;el('fire').disabled=true;message('彈珠碰撞中……');let pins=el('pins').children;for(let i=0;i<pins.length;i++)pins[i].style.transform='translateY('+(R(-19,10))+'px)';setTimeout(()=>{const score=[10,20,40,60,80,100][R(0,5)];busy=false;el('fire').disabled=false;if(score>=60)pass(3,score,'本次得分 '+score+' 分！');else message('🎰 本次 '+score+' 分，尚未過關，歡迎重玩！')},1000)}}
}
el('games').innerHTML=names.map((n,i)=>'<button class="tile" data-game="'+i+'"><span>'+emoji[i]+'</span><strong>'+n+'</strong><br><small>點此進入遊戲</small></button>').join('');document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>enter(Number(b.dataset.game)));
el('team').value=state.team;el('memory').value=state.memory;el('saveTeam').onclick=()=>{state.team=el('team').value.trim();save();message('隊名已保存在本機。')};el('saveMemory').onclick=()=>{state.memory=el('memory').value;save();message('紀念卡已保存！')};el('print').onclick=()=>{state.memory=el('memory').value;save();window.print()};el('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='幸福列車_闖關備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};el('importBtn').onclick=()=>el('file').click();el('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>100000)throw Error('備份檔案太大');const d=JSON.parse(await f.text());if(!Array.isArray(d.stamps)||d.stamps.length!==4)throw Error('格式不正確');state={team:String(d.team||'').slice(0,35),memory:String(d.memory||'').slice(0,500),stamps:d.stamps.map(x=>x===true),scores:Array.from({length:4},(_,i)=>typeof d.scores?.[i]==='number'?d.scores[i]:null)};el('team').value=state.team;el('memory').value=state.memory;save();message('已匯入備份！')}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};el('reset').onclick=()=>{if(confirm('確定要清除這台裝置的隊名、印章與回憶？')){state=blank();el('team').value='';el('memory').value='';save();message('本機進度已清除。')}};render();
</script></body></html>
