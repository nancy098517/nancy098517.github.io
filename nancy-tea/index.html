function renderOrders(){let html=state.orders.map(o=>`<article class="order ${o.id===state.selected?'active':''}"><div class="customer"><span class="face">${o.face}</span>${o.name}<span class="badge">#${o.id}</span></div><h3>${o.topping==='不加料'?'':o.topping} ${o.tea}</h3><div class="details">${o.sugar} · ${o.cold}<br>${o.topping==='不加料'?'不要加料':o.topping+'加一份'}</div><div class="patience"><i style="width:${100*o.life/o.max}%"></i></div><button data-order="${o.id}" aria-label="選擇第 ${o.id} 號訂單"></button></article>`).join('');$('orders').innerHTML=html||'<div class="empty">下一位客人快到了…</div>';document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{if(!playable())return;state.selected=+b.dataset.order;renderOrders();toast('已選擇訂單 #'+state.selected);});}

function update(){ $('time').textContent=Math.floor(state.left/60)+':'+String(state.left%60).padStart(2,'0');$('cash').textContent='$'+state.cash;$('done').textContent=state.done+' 杯';$('combo').textContent=state.combo+' 🔥';$('level').textContent=state.done<3?'新手店長':state.done<6?'人氣調飲師':'尖峰時刻';}

const API='https://nancy-tea-shop-20261126.cloudyhydrangea8.chatgpt.site/api';
async function api(path,body){let controller=new AbortController(),t=setTimeout(()=>controller.abort(),10000);try{let r=await fetch(API+path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal,credentials:'omit'});let j=await r.json();if(!r.ok)throw new Error(j.error||'連線失敗');return j;}finally{clearTimeout(t);}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function scorePayload(){return {session:state.session,cash:state.cash,cost:state.cost,done:state.done,miss:state.miss};}
async function prepareRank(){let run=state,box=$('rankbox');if(!box)return;if(!run.session){box.textContent='本局未連上排行榜，成績未登錄。下次開店會重新連線。';return;}if(!run.done){box.textContent='完成至少一杯，就可以挑戰排行榜！';return;}try{let j=await api('/rank',scorePayload());if(state!==run||$('rankbox')!==box)return;if(j.rank>100){box.textContent='本次暫列第 '+j.rank+' 名，前 100 名才能登榜，再挑戰一次吧！';return;}let name='';try{name=localStorage.getItem('nancy-tea-nickname')||'';}catch(e){}box.innerHTML='<strong>本次目前可排第 '+j.rank+' 名！</strong><p class="rankstatus">送出後依最新成績決定名次。</p><label for="nickname">輸入暱稱（1～16 字）</label><input id="nickname" maxlength="16" autocomplete="nickname" placeholder="例如：Nancy" value="'+esc(name)+'"><small>暱稱及成績將公開顯示，請勿填真實個資。</small><button class="primary" id="submitrank">登錄排行榜</button><div id="rankmessage" class="rankstatus" aria-live="polite"></div>';$('submitrank').onclick=async()=>{let n=$('nickname').value.trim();if(!n){$('rankmessage').textContent='請先輸入暱稱';return;}let b=$('submitrank');b.disabled=true;b.textContent='正在登錄…';try{let result=await api('/score',{...scorePayload(),name:n});if(state!==run||$('rankbox')!==box)return;try{localStorage.setItem('nancy-tea-nickname',n);}catch(e){}box.textContent=result.qualified?'登錄成功！'+n+'，目前第 '+result.rank+' 名。':'其他店長剛剛超前了，本次未進入前 100 名，再接再厲！';}catch(e){if($('rankmessage'))$('rankmessage').textContent=e.message;b.disabled=false;b.textContent='再試一次登錄';}};}catch(e){if(state!==run||$('rankbox')!==box)return;box.innerHTML='<p class="rankstatus">'+esc(e.message)+'</p><button class="secondary" id="retryrank">重新查詢排名</button>';$('retryrank').onclick=prepareRank;}}
async function showBoard(){if(opening)return;state.paused=true;$('overlay').hidden=false;$('dialog').innerHTML='<h1 class="ranktitle">人氣店長排行榜</h1><p class="rankingnote">所有玩家共用 · 保留前 100 名<br>依營收、食材毛利、完成杯數排序；再同分先登錄者優先。</p><div id="leadercontent" class="leader-scroll" aria-live="polite">正在載入…</div><button class="primary" id="closeboard">'+(state.running?'回到飲料店':'回到開店畫面')+'</button>';$('closeboard').onclick=()=>{if(state.running){state.paused=false;$('overlay').hidden=true;}else intro();};let container=$('leadercontent');try{let j=await api('/leaderboard');if($('leadercontent')!==container)return;if(!j.scores.length){container.textContent='還沒有店長登榜，第一個紀錄等你來挑戰！';return;}container.innerHTML='<table class="leaderlist"><thead><tr><th>名次</th><th>店長</th><th>營收</th><th>毛利</th><th>杯數</th></tr></thead><tbody>'+j.scores.map(r=>'<tr><td>'+r.rank+'</td><td>'+esc(r.name)+'<span class="rankdate">'+new Date(r.created).toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei'})+'</span></td><td>$'+r.cash+'</td><td>$'+r.profit+'</td><td>'+r.done+'</td></tr>').join('')+'</tbody></table>';}catch(e){if($('leadercontent')===container)container.textContent=e.message;}}

$('ranking').onclick=showBoard;$('action').onclick=serve;$('shake').onclick=shake;$('reset').onclick=()=>{if(playable())resetDrink(true);};$('help').onclick=intro;$('pause').onclick=()=>{if(state.running)intro();};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊';};$('cup').onpointerdown=e=>{if(!playable()||!state.phase)return;lastX=e.clientX;lastDir=0;$('cup').setPointerCapture(e.pointerId);};$('cup').onpointermove=e=>{if(lastX===null)return;let dx=e.clientX-lastX;if(Math.abs(dx)>14){let dir=Math.sign(dx);if(dir!==lastDir){shake();lastDir=dir;}lastX=e.clientX;}};$('cup').onpointerup=$('cup').onpointercancel=()=>lastX=null;document.addEventListener('keydown',e=>{if(e.code==='Space'&&state.phase&&playable()){e.preventDefault();if(!e.repeat)shake();}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.running&&!state.paused)intro();});renderDrink();update();intro();
</script></body></html>
